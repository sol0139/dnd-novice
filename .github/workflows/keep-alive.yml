name: Будильник для базы

# Бесплатный Supabase засыпает после недели без запросов.
# Раз в день спрашиваем базу о несуществующем персонаже — этого хватает, чтобы она не уснула.
# Ключ ниже публичный (тот же, что в config.js), секретов здесь нет.
on:
  schedule:
    - cron: "17 4 * * *"   # каждый день в 04:17 UTC, это 09:17 по Душанбе
  workflow_dispatch:        # кнопка «Run workflow», чтобы проверить вручную

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Постучаться в базу
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            "https://ebbmnaxywnovzuqdszdu.supabase.co/rest/v1/rpc/get_shared_character" \
            -H "Content-Type: application/json" \
            -H "apikey: sb_publishable_yk9frCrSbo2RuWLIFrDWVw_hXuXkeD0" \
            -d '{"slug":"keepalive"}')
          echo "Ответ базы: $status"
          test "$status" = "200"
