<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Чарник D&D для новичков: способности разложены по ходу, всё объяснено простыми словами.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%232EB41B'/%3E%3Cpath d='M16 6l8.5 4.9v10.2L16 26l-8.5-4.9V10.9z M16 6l-5 14h10z' fill='none' stroke='white' stroke-width='1.8' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#2EB41B">
<title>Чарник новичка</title>
<script src="/config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@500;600&family=Wix+Madefor+Text:wght@600&display=swap">
<link rel="stylesheet" href="/theme.css">
<style>
/* Раскладка: приложение-чарник в стиле AutoOne. Одна колонка до 600px, мягкое зелёное свечение сверху,
   карточки со скруглением 24, плавающая стеклянная панель вкладок снизу, модалки — шторкой снизу. */

.wrap{
  max-width:600px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:12px calc(48px + env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column;gap:24px;
}
.loading{padding-block:38vh 0;text-align:center;color:var(--fg-3);font-size:15px}

/* Цвет типа действия */
[data-kind="action"]{--k:var(--k-action)}
[data-kind="bonus"]{--k:var(--k-bonus)}
[data-kind="reaction"]{--k:var(--k-reaction)}
[data-kind="movement"]{--k:var(--k-movement)}
[data-kind="passive"]{--k:var(--k-passive)}
[data-kind="long"]{--k:var(--k-passive)}

/* Шапка */
.top{display:flex;flex-direction:column;gap:16px}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px}
.eyebrow{font-size:14px;font-weight:500;color:var(--fg-3)}
.iconbtn{flex:none;width:48px;height:48px;border-radius:50%;border:0;background:var(--glass);color:var(--fg);display:grid;place-items:center}
.who{display:flex;flex-direction:column;gap:8px}
h1{font-family:var(--f-head);font-weight:600;font-size:34px;line-height:1.05;letter-spacing:-.5px}
.pitch{font-size:16px;line-height:1.4;color:var(--fg-2);max-width:36ch}
.bgline{font-size:14px;color:var(--fg-3)}
.quick{display:flex;flex-wrap:wrap;gap:8px}
.qbtn{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:10px 16px;border:0;border-radius:20px;
  background:var(--surface);box-shadow:var(--shadow);font-family:var(--f-btn);font-weight:600;font-size:15px;letter-spacing:-.15px;color:var(--fg)}
.qbtn:active{transform:scale(.97)}
.q-sub{font-family:var(--f-body);font-weight:500;color:var(--accent-ink)}

/* Общие кирпичи */
.panel{display:flex;flex-direction:column;gap:28px}
.sec{display:flex;flex-direction:column;gap:12px}
.sec-h{display:flex;flex-direction:column;gap:4px}
h2{font-family:var(--f-head);font-weight:500;font-size:20px;line-height:1.15;letter-spacing:-.5px;display:flex;align-items:center;gap:10px}
h2 .dot{flex:none;width:10px;height:10px;border-radius:50%;background:var(--k)}
.sec[data-kind="passive"] h2 .dot{background:transparent;box-shadow:inset 0 0 0 2px var(--k)}
.sec-h p{font-size:14px;line-height:1.4;color:var(--fg-3);max-width:58ch}
.sub{font-family:var(--f-body);font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--fg-3);margin-top:4px}
.card{background:var(--surface);border-radius:24px;box-shadow:var(--shadow)}
.meta{font-size:14px;line-height:1.4;color:var(--fg-3)}
.term{background:none;border:0;padding:0;font:inherit;color:inherit;text-align:inherit;letter-spacing:inherit;
  text-decoration:underline dotted;text-decoration-thickness:1.5px;text-underline-offset:3px;
  text-decoration-color:color-mix(in srgb,currentColor 45%,transparent);cursor:help}
.btn{min-height:44px;padding:11px 18px;border:0;border-radius:20px;font-family:var(--f-btn);font-weight:600;font-size:15px;letter-spacing:-.15px}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.neutral{background:var(--neutral);color:var(--fg)}
.btn.wide{width:100%}

/* Хиты */
.hp{padding:20px;display:flex;flex-direction:column;gap:14px}
.hp-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.tl{font-size:13px;line-height:1.25;color:var(--fg-3)}
.hp-num{display:flex;align-items:baseline;gap:6px;margin-top:4px;font-family:var(--f-head);font-variant-numeric:tabular-nums}
.hp-num b{font-weight:600;font-size:44px;line-height:1;letter-spacing:-1px}
.hp-num b.low{color:var(--danger)}
.hp-num small{font-size:18px;font-weight:500;color:var(--fg-3)}
.hp-btns{display:flex;gap:8px}
.round{width:48px;height:48px;border:0;border-radius:50%;background:var(--glass);color:var(--fg);
  font-family:var(--f-head);font-size:22px;font-weight:500;line-height:1;display:grid;place-items:center}
.round:active{transform:scale(.94)}
.hp-bar{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:4px}
.hp-bar button{height:22px;padding:0;border:0;border-radius:7px;background:var(--accent)}
.hp-bar.low button{background:var(--danger)}
.hp-bar button.off{background:var(--neutral)}
.down{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:14px 16px;border-radius:18px;
  background:color-mix(in srgb,var(--danger) 11%,var(--surface));font-size:15px;line-height:1.4}
.stats2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tile{padding:16px 18px;display:flex;flex-direction:column;gap:4px;min-width:0}
.tile .tv{font-family:var(--f-head);font-weight:600;font-size:28px;line-height:1.1;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.tile .ts{font-size:13px;line-height:1.3;color:var(--fg-3)}

/* Панель хода: тап по кружку открывает список, выбранное гаснет до нового хода */
.turn-h{margin-bottom:-14px}
.turnbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:5;margin-bottom:28px;
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;align-items:stretch;padding:10px;border-radius:26px;
  background:color-mix(in srgb,var(--surface) 86%,transparent);box-shadow:var(--shadow-float);
  -webkit-backdrop-filter:blur(16px) saturate(1.3);backdrop-filter:blur(16px) saturate(1.3)}
.tok{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-width:0;min-height:84px;padding:10px 4px;
  border:0;border-radius:20px;background:transparent;transition:background-color .15s}
.tok:hover{background:var(--neutral)}
.tok i{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--k);color:var(--on-k);
  transition:background-color .15s,box-shadow .15s,opacity .15s}
.tok i svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tok span{font-size:13.5px;font-weight:500;color:var(--fg-3);white-space:nowrap}
.tok[data-spent="true"] i{background:transparent;color:var(--k);opacity:.55;box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--k) 55%,transparent)}
.tok[data-spent="true"] span{text-decoration:line-through;opacity:.7}
.tok.fresh i{background:var(--accent);color:var(--on-accent)}
.tok:active i{transform:scale(.94)}
.turn-foot{grid-column:1 / -1;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:2px;padding:10px 0 0 8px;border-top:1px solid var(--line)}
.turn-now{flex:1;min-width:0;font-size:13.5px;line-height:1.35;color:var(--fg-3)}
.newturn{flex:none;display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px 0 12px;border:1.5px dashed color-mix(in srgb,var(--fg-3) 45%,transparent);
  border-radius:18px;background:transparent;color:var(--fg);font-family:var(--f-btn);font-weight:600;font-size:14.5px;letter-spacing:-.15px}
.newturn:hover{background:var(--neutral)}
.newturn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .35s}
.newturn:active svg{transform:rotate(-180deg)}

/* Список выбора в шторке */
.dr-sub{font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--fg-3);margin-top:4px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;flex-direction:column;align-items:flex-start;gap:8px;width:100%;padding:16px 18px;border:0;border-radius:20px;
  background:var(--neutral);color:var(--fg);text-align:left;transition:background-color .15s}
.opt:hover{background:color-mix(in srgb,var(--accent) 10%,var(--neutral))}
.opt:active{transform:scale(.99)}
.opt[disabled]{opacity:.5;cursor:not-allowed}
.opt-n{font-weight:600;font-size:16px;line-height:1.3}
.opt-d{font-size:14px;line-height:1.4;color:var(--fg-3)}
.opt .chip{background:var(--surface)}
.sk{display:flex;flex-direction:column;gap:6px}
.sk-row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px;padding:12px 12px 12px 16px;border-radius:16px;background:var(--neutral)}
.sk-row b{font-weight:600;font-size:15.5px;color:var(--fg)}
.sk-row p{font-size:13.5px;line-height:1.35;color:var(--fg-3)}
.sk-row .val{background:var(--surface)}
.sk-row.mine b::after{content:"";display:inline-block;width:7px;height:7px;margin-left:8px;border-radius:50%;background:var(--accent);vertical-align:middle}
.ret{display:flex;flex-direction:column;gap:6px}
.ret-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-radius:16px;background:var(--neutral);font-size:15px;color:var(--fg)}
.ret-row em{font-style:normal;font-size:13.5px;color:var(--fg-3);text-align:right}
.ret-row.back em{color:var(--accent-ink);font-weight:500}
.dr-block{display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:24px;box-shadow:inset 0 0 0 1.5px var(--line)}
.dr-block-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.dr-block-h b{font-weight:600;font-size:16px;color:var(--fg)}
.hd-note{padding:12px 14px;border-radius:16px;background:color-mix(in srgb,var(--accent) 12%,transparent);font-size:14.5px;line-height:1.4;color:var(--fg)}

/* Карточка способности */
.ab{padding:18px 20px 20px;display:flex;flex-direction:column;gap:12px}
.ab-h{display:flex;align-items:baseline;gap:12px}
.ab-h h3{flex:1;min-width:0;font-family:var(--f-body);font-weight:600;font-size:17px;line-height:1.3}
.src{flex:none;padding:3px 10px;border-radius:999px;background:var(--neutral);font-size:12px;font-weight:500;color:var(--fg-3)}
.plain{font-size:15.5px;line-height:1.45;color:var(--fg-2)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:baseline;flex-wrap:wrap;gap:4px 8px;padding:9px 14px;border-radius:14px;background:var(--neutral)}
.chip .cl,.chip .cu{font-size:13px;color:var(--fg-3)}
.chip b{font-family:var(--f-head);font-weight:600;font-size:16px;letter-spacing:-.3px;color:var(--fg)}
.move{display:flex;align-items:center;gap:14px}
.move b{font-family:var(--f-head);font-weight:600;font-size:40px;line-height:1;letter-spacing:-1px;color:var(--k)}
.move span{font-size:14px;line-height:1.3;color:var(--fg-3)}
.why summary{width:max-content;max-width:100%;font-size:14px;font-weight:500;color:var(--accent-ink);cursor:pointer}
.why p{margin-top:6px;font-size:14px;line-height:1.45;color:var(--fg-3)}
.use{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 12px;padding-top:2px}
.use-info{display:flex;align-items:center;gap:10px;min-width:0;font-size:13.5px;color:var(--fg-3)}
.pips{display:inline-flex;gap:5px;flex:none}
.pips i{width:14px;height:14px;border-radius:5px;box-shadow:inset 0 0 0 2px var(--accent)}
.pips i.full{background:var(--accent)}
.use-btns{display:inline-flex;gap:8px;flex-wrap:wrap}
.ab.spent > :not(.use){opacity:.45;transition:opacity .2s}

.common summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 20px;font-weight:600;font-size:15.5px;cursor:pointer}
.common summary::-webkit-details-marker{display:none}
.chev{flex:none;width:9px;height:9px;border-right:2px solid var(--fg-3);border-bottom:2px solid var(--fg-3);transform:rotate(45deg) translateY(-3px);transition:transform .2s}
.common[open] .chev{transform:rotate(-135deg) translateY(-1px)}
.common dl{display:flex;flex-direction:column;padding:0 20px 8px}
.ca{padding:14px 0;display:flex;flex-direction:column;gap:4px;border-top:1px solid var(--line)}
.ca dt{font-weight:600;font-size:15px}
.ca dd{font-size:14.5px;line-height:1.45;color:var(--fg-3)}
.ca dd b{color:var(--fg);font-weight:600}

/* Хиты: длинная полоска для больших запасов; ряд кнопок внизу «Снаряги» */
.hp-tools{display:flex;flex-wrap:wrap;gap:8px}
.hp-tools .btn{flex:1;min-width:8em}
.btn.danger{background:var(--danger);color:#fff}
.hp-meter{position:relative;height:22px;border-radius:9px;background:var(--neutral);overflow:hidden;cursor:pointer}
.hp-meter i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:9px;transition:width .2s}
.hp-meter.low i{background:var(--danger)}
/* Спасброски от смерти */
.ds{display:flex;flex-direction:column;gap:8px;width:100%}
.ds-row{display:flex;align-items:center;gap:10px;font-size:14px}
.ds-row span{min-width:5.5em;color:var(--fg-3)}
.ds-row i{width:18px;height:18px;border-radius:50%;box-shadow:inset 0 0 0 2px currentColor;opacity:.5}
.ds-row i.on{opacity:1;background:currentColor}
.ds-row.ok{color:var(--accent-ink)}.ds-row.bad{color:var(--danger)}
.ds-btns{display:flex;flex-wrap:wrap;gap:8px}
/* Концентрация */
.conds{display:flex;flex-direction:column;gap:8px}
.conds[hidden]{display:none}
.cond{display:flex;align-items:flex-start;gap:12px;padding:12px 10px 12px 16px;border-radius:18px;background:color-mix(in srgb,var(--danger) 9%,var(--surface));box-shadow:var(--shadow)}
.cond div{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.cond b{font-weight:600;font-size:15px}
.cond p{font-size:13.5px;line-height:1.35;color:var(--fg-3)}
.cond.conc{background:color-mix(in srgb,var(--k-reaction) 12%,var(--surface))}
.x{flex:none;width:36px;height:36px;border:0;border-radius:50%;background:var(--neutral);color:var(--fg-2);font-size:18px;line-height:1}
/* Вдохновение, подсказки, заметки, приветствие */
.qbtn[aria-pressed="true"]{background:color-mix(in srgb,var(--k-bonus) 22%,var(--surface))}
.qbtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linejoin:round}
.qbtn[aria-pressed="true"] svg{fill:currentColor}
.tips summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;font-weight:600;font-size:15.5px;cursor:pointer}
.tips summary::-webkit-details-marker{display:none}
.tips[open] .chev{transform:rotate(-135deg) translateY(-1px)}
.tips ol{margin:0;padding:0 20px 18px 40px;display:flex;flex-direction:column;gap:8px;font-size:15px;line-height:1.45;color:var(--fg-2)}
.notes{width:100%;min-height:140px;padding:14px 16px;border:0;border-radius:20px;background:var(--surface);box-shadow:var(--shadow);color:var(--fg);font:inherit;font-size:15.5px;line-height:1.45;resize:vertical}
.hello{padding:18px 20px;display:flex;flex-direction:column;gap:10px;background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.hello h3{font-family:var(--f-head);font-weight:500;font-size:18px;letter-spacing:-.3px}
.hello ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:15px;line-height:1.45;color:var(--fg-2)}
.hello .btn{align-self:flex-start}
.offline{padding:12px 16px;border-radius:16px;background:color-mix(in srgb,var(--k-bonus) 14%,var(--surface));font-size:14px;line-height:1.4}

/* Печать: все вкладки подряд, без кнопок и теней */
@media print{
  body{background:#fff}
  .wrap{max-width:none;padding:0;gap:14px}
  .top-btns,.quick,.tabs,.turnbar,.turn-h,.hp-tools,.hp-btns,.hp-bar,.hp-meter,.addcond,.toast-wrap,.hello,.offline,.use-btns,.use button,.cast button,.spend button,.slot-row .use-btns,.foot,.x,#p-gear .sec:last-child,.notes:placeholder-shown{display:none !important}
  .panel{display:flex !important;gap:14px}
  .card,.ab,.tile,.abil{box-shadow:none !important;border:1px solid #ccc !important;break-inside:avoid}
  .abil .ak,.why summary{display:none}
  .sec{break-inside:auto}
  h2{font-size:17px}
  .notes{box-shadow:none;border:1px solid #ccc;min-height:0}
}

/* Заклинания лентой с боковым скроллом внутри секций хода */
.srow{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.srow-h{display:flex;align-items:baseline;gap:4px 10px;flex-wrap:wrap}
.srow-h b{font-weight:600;font-size:15.5px}
.srow-n{font-size:13px;color:var(--fg-3)}
.srow-hint{margin-left:auto;font-size:12.5px;color:var(--fg-3)}
.hscroll{display:flex;align-items:stretch;gap:10px;overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;
  margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:4px max(16px,env(safe-area-inset-left,0px)) 16px;
  scroll-padding-inline:max(16px,env(safe-area-inset-left,0px));scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.hscroll > .ab{flex:0 0 min(300px,84%);scroll-snap-align:start}
.hscroll > .ab .cast{margin-top:auto}
.slots-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;padding:8px 0 2px;font-weight:600;font-size:15px}
.slots-h span{font-weight:400;font-size:13px;color:var(--fg-3)}
@media print{ .hscroll{flex-wrap:wrap;overflow:visible;margin:0;padding:0} .hscroll > .ab{flex:1 1 280px} .srow-hint{display:none} }

/* Магия */
.badges{display:flex;flex-wrap:wrap;gap:6px}
.badge{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:13px;background:var(--neutral);font-size:12.5px;font-weight:500;color:var(--fg-3)}
.badge.kind{gap:7px;color:var(--fg-2)}
.badge.kind i{width:8px;height:8px;border-radius:50%;background:var(--k)}
.ab[data-kind="long"] .badge.kind i{background:transparent;box-shadow:inset 0 0 0 2px var(--k)}
.badge.conc{background:color-mix(in srgb,var(--k-reaction) 16%,transparent);color:var(--fg-2)}
.slots{padding:8px 8px 8px 18px;display:flex;flex-direction:column}
.slot-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 12px;padding:10px 0}
.slot-row + .slot-row{border-top:1px solid var(--line)}
.slot-row b{font-weight:600;font-size:15.5px}
.slot-row .use-info{flex:1;white-space:nowrap}
.slot-row .use-btns{margin-left:auto}
@media (max-width:420px){ .slot-row .use-info span:last-child{display:none} }
.slot-row .btn{min-height:40px;padding:8px 14px;font-size:14px}
.cast{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding-top:2px}
.cast .meta{flex:1;min-width:12em}
.spend{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding-top:2px}

/* Спасброски */
.saves{padding:8px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px}
.sv{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px;border-radius:16px;min-width:0}
.sv span{font-size:15px;min-width:0}
.sv b{font-family:var(--f-head);font-weight:600;font-size:17px;font-variant-numeric:tabular-nums}
.sv.strong{position:relative;background:var(--neutral)}
.sv.strong::after{content:"";position:absolute;top:8px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.mini{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;padding:0 4px;font-size:14px;color:var(--fg-3)}
.mini b{font-family:var(--f-head);font-weight:600;color:var(--fg)}

/* Характеристики и навыки */
.abils{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.abil{padding:16px 16px 16px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:0;
  border:0;font:inherit;color:var(--fg);text-align:left;transition:transform .1s}
.abil:hover{box-shadow:var(--shadow),inset 0 0 0 1.5px color-mix(in srgb,var(--accent) 35%,transparent)}
.abil:active{transform:scale(.98)}
.abil .ak{margin-top:auto;padding-top:10px;font-size:13px;font-weight:500;color:var(--accent-ink)}
.abil .an{font-size:15px;font-weight:600}
.abil .am{font-family:var(--f-head);font-weight:600;font-size:30px;line-height:1.15;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.abil .as{font-size:12.5px;color:var(--fg-3)}
.abil .ap{margin-top:6px;font-size:13px;line-height:1.35;color:var(--fg-3)}
.rows{overflow:hidden}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:14px;padding:14px 16px 14px 20px}
.row + .row{border-top:1px solid var(--line)}
.row b{font-weight:600;font-size:15.5px}
.row p{font-size:14px;line-height:1.4;color:var(--fg-3)}
.val{min-width:3.2em;padding:7px 12px;border-radius:14px;background:var(--neutral);text-align:center;
  font-family:var(--f-head);font-weight:600;font-size:17px;font-variant-numeric:tabular-nums}
.others{padding:8px 10px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:8px}
.os{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:10px;min-width:0}
.os span{font-size:14.5px;min-width:0}
.os span small{display:block;font-size:11.5px;letter-spacing:.04em;color:var(--fg-3)}
.os b{font-family:var(--f-head);font-weight:600;font-size:15px;font-variant-numeric:tabular-nums}
.langs{display:flex;flex-wrap:wrap;gap:8px}
.lang{padding:11px 18px;border-radius:20px;font-weight:500}

/* Снаряга и словарик */
.list{overflow:hidden}
.li{padding:16px 20px;display:flex;flex-direction:column;gap:4px}
.li + .li{border-top:1px solid var(--line)}
.li b{font-weight:600;font-size:16px}
.li .q{font-family:var(--f-head);font-weight:500;font-size:13px;color:var(--fg-3);margin-left:6px}
.li span,.li p{font-size:14.5px;line-height:1.45;color:var(--fg-3)}
.li h3{font-family:var(--f-head);font-weight:500;font-size:16px;letter-spacing:-.3px}
.foot{display:flex;flex-direction:column;gap:6px;padding-top:4px;font-size:12.5px;line-height:1.45;color:var(--fg-3)}
.foot a{color:var(--accent-ink);font-weight:500}

/* Вкладки: сегменты под кнопками отдыха */
.tabs{display:grid;grid-template-columns:repeat(var(--tabs,3),minmax(0,1fr));gap:4px;padding:4px;margin-top:4px;border-radius:22px;background:var(--surface);box-shadow:var(--shadow)}
.tab{min-width:0;min-height:48px;padding:10px 8px;border:0;border-radius:18px;background:transparent;color:var(--fg-3);
  display:flex;flex-direction:row;align-items:center;justify-content:center;gap:6px;
  font-family:var(--f-btn);font-weight:600;font-size:14px;letter-spacing:-.15px;transition:background-color .15s,color .15s}
.tab span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab svg.i{width:19px;height:19px}
/* На узком телефоне «Характеристики» с иконкой не влезают в треть ширины — там подпись «Статы» */
.tab .short{display:none}
@media (max-width:479px){ .tab .long{display:none} .tab .short{display:inline} }
.tab:hover{color:var(--fg)}
.tab[aria-selected="true"]{background:var(--accent);color:var(--on-accent)}
.top-btns{display:flex;align-items:center;gap:8px;flex:none}
.pillbtn{display:inline-flex;align-items:center;gap:8px;height:48px;padding:0 18px 0 14px;border:0;border-radius:24px;background:var(--glass);color:var(--fg);
  font-family:var(--f-btn);font-weight:600;font-size:15px;letter-spacing:-.15px}
.pillbtn svg{width:22px;height:22px}
.dict-item{padding:14px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.dict-item h4{font-family:var(--f-head);font-weight:500;font-size:16px;letter-spacing:-.3px;color:var(--fg)}
.dict-item p{font-size:15px;line-height:1.45;color:var(--fg-3)}

/* Подсказка снизу */
.toast-wrap{position:fixed;left:0;right:0;z-index:16;display:flex;justify-content:center;pointer-events:none;
  bottom:calc(16px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.toast{pointer-events:auto;width:100%;max-width:568px;display:flex;align-items:center;gap:12px;padding:12px 12px 12px 18px;
  border-radius:20px;background:var(--toast-bg);color:var(--toast-fg);box-shadow:var(--shadow-float);font-size:15px;line-height:1.35}
.toast p{flex:1;min-width:0}
.toast button{flex:none;min-height:40px;padding:8px 14px;border:0;border-radius:14px;
  background:color-mix(in srgb,var(--toast-fg) 14%,transparent);color:var(--toast-fg);font-family:var(--f-btn);font-weight:600;font-size:14px}
@media (prefers-reduced-motion:no-preference){
  .toast.pop{animation:pop .22s cubic-bezier(.2,.9,.3,1.2)}
  @keyframes pop{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
}

/* Шторка */
dialog.drawer{margin:auto auto 0;width:100%;max-width:600px;max-height:85vh;padding:0;border:0;border-radius:32px 32px 0 0;
  background:var(--surface);color:var(--fg);overflow:auto}
dialog.drawer::backdrop{background:var(--scrim);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.dr{display:flex;flex-direction:column;gap:14px;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
.dr-h{display:flex;align-items:center;gap:16px;padding-bottom:2px}
.dr-h h3{flex:1;min-width:0;font-family:var(--f-head);font-weight:500;font-size:20px;line-height:1.15;letter-spacing:-.5px}
.dr-x{flex:none;width:40px;height:40px;border:0;border-radius:40px;background:var(--neutral);color:var(--fg);display:grid;place-items:center}
.dr-body{display:flex;flex-direction:column;gap:14px;padding-right:4px;font-size:16px;line-height:1.5;color:var(--fg-2)}
.dr-stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.dr-stat{padding:14px 16px;border-radius:20px;background:var(--neutral);display:flex;flex-direction:column;gap:2px}
.dr-stat span{font-size:13px;color:var(--fg-3)}
.dr-stat b{font-family:var(--f-head);font-weight:600;font-size:22px;letter-spacing:-.5px;color:var(--fg)}
</style>
<script>
  /* Тема выставляется до отрисовки, чтобы страница не мигала */
  try { var t = localStorage.getItem("novice-sheet:theme"); if (t) document.documentElement.setAttribute("data-theme", t); } catch (e) {}
</script>

<body>
<div class="wrap" id="app">
  <p class="loading">Достаём персонажа из сумки…</p>
</div>


<div class="toast-wrap" id="toastWrap" hidden>
  <div class="toast" id="toast" role="status" aria-live="polite">
    <p id="tMsg"></p>
    <button type="button" id="tUndo" data-act="undo" hidden>Отменить</button>
  </div>
</div>

<dialog class="drawer" id="drawer" aria-labelledby="drTitle">
  <div class="dr">
    <div class="dr-h">
      <h3 id="drTitle"></h3>
      <button type="button" class="dr-x" id="drClose" aria-label="Закрыть">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg>
      </button>
    </div>
    <div class="dr-body" id="drBody"></div>
  </div>
</dialog>

<script>
(() => {
/* ============================================================
   Лист персонажа. Страница ничего не знает про персонажа заранее:
   /c/код              — персонаж мастера из базы Supabase
   любой другой адрес  — пример, Мирта из data/mirta.json
   data/knowledge.json — база знаний: характеристики, навыки,
                         словарик и общие действия
   ============================================================ */

const $  = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const app = $("#app");
let KEY = "novice-sheet:demo:v2";
const TAB_KEY = "novice-sheet:tab", THEME_KEY = "novice-sheet:theme";

const KINDS = {
  action:   { name: "Действие",          term: "action",   note: "Одно за ход. Выбери, что делаешь." },
  bonus:    { name: "Бонусное действие", term: "bonus",    note: "Одно за ход, и только если есть способность на него." },
  reaction: { name: "Реакция",           term: "reaction", note: "Одна за раунд. Можно потратить и в чужой ход." },
  movement: { name: "Движение",          term: "movement", note: "Делится как угодно: до, после и между действиями." },
  passive:  { name: "Работает само",     term: null,       note: "Нажимать ничего не нужно, просто помни об этом." },
  long:     { name: "Вне боя",           term: null,       note: "Колдуется минуту и дольше: для разведки и передышки, не для схватки." }
};
const ABBR = { str: "СИЛ", dex: "ЛОВ", con: "ТЕЛ", int: "ИНТ", wis: "МДР", cha: "ХАР" };

const ICON_MOON = `<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.2A8 8 0 1 1 9.8 4a6.4 6.4 0 0 0 10.2 10.2z"/></svg>`;
const ICON_SUN  = `<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>`;

let CH, KB, S, snapshot = null, drawerMode = null, offlineNote = false;
const byId = {};

/* ---------- помощники ---------- */
const esc  = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const sg   = n => (n < 0 ? "−" : "+") + Math.abs(n);
const term = (k, text) => `<button type="button" class="term" data-term="${k}">${esc(text)}</button>`;
// [[ключ|текст]] в JSON превращается в подчёркнутое слово из словарика
const rich = s => esc(s).replace(/\[\[([a-z0-9-]+)\|([^\]]+)\]\]/g, (_, k, t) => `<button type="button" class="term" data-term="${k}">${t}</button>`);

// "1d8+5" → "1к8+5", "1d20+5" → "к20+5"
function showF(f){
  const m = /^(\d*)d(\d+)([+-]\d+)?$/.exec(String(f).replace(/\s+/g, ""));
  if (!m) return f;
  const n = +(m[1] || 1), sides = +m[2], mod = m[3] ? +m[3] : 0;
  let s = (n === 1 && sides === 20 ? "" : n) + "к" + sides;
  if (mod) s += (mod > 0 ? "+" : "−") + Math.abs(mod);
  return s;
}
const plural = (n, one, few, many) => { const t = n % 10, h = n % 100; return t === 1 && h !== 11 ? one : t >= 2 && t <= 4 && (h < 12 || h > 14) ? few : many; };
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
// Род в подсказках: pronoun "she" в данных персонажа — женский, иначе мужской
const gf = (f, m) => (CH && CH.pronoun === "she" ? f : m);
const d20 = b => "1d20" + (b >= 0 ? "+" : "") + b;

/* ---------- числа, которые страница считает сама ---------- */
const am        = a => Math.floor((CH.abilities[a] - 10) / 2);
const pb        = () => CH.proficiencyBonus;
const isExpert  = id => (CH.expertise || []).includes(id);
const hasSkill  = id => CH.skills.includes(id) || isExpert(id);
const skill     = id => KB.skills.find(s => s.id === id);
// экспертиза — двойное мастерство; ручные поправки из импорта прибавляются сверху
// «Мастер на все руки» у барда: половина мастерства к навыкам без мастерства
const half      = () => (CH.halfProf ? Math.floor(pb() / 2) : 0);
const skillB    = s => am(s.ability) + (isExpert(s.id) ? 2 * pb() : hasSkill(s.id) ? pb() : half()) + ((CH.skillMods || {})[s.id] || 0);
const saveB     = a => am(a) + (CH.saves.includes(a) ? pb() : 0) + ((CH.saveMods || {})[a] || 0);
const initB     = () => CH.initiative ?? am("dex") + half();
const squares   = () => CH.speed / 5;
const hitDieF   = () => CH.hitDice.die + (am("con") >= 0 ? "+" : "") + am("con");
const hdLeft    = () => CH.hitDice.count - S.hitDiceUsed;
const usesLeft  = f => f.uses.max - (S.used[f.id] || 0);
const attackOf  = f => f.attack || byId[f.attackRef].attack;
const scene     = f => f.scene || "combat";
// Заклинания и ячейки
const SC        = () => CH.spellcasting || null;
const slotMax   = l => ((SC() || {}).slots || {})[l] || 0;
const slotLeft  = l => slotMax(l) - ((S.slots || {})[l] || 0);
const slotLevels = () => Object.keys((SC() || {}).slots || {}).map(Number).filter(l => slotMax(l) > 0).sort((a, b) => a - b);
const slotFor   = lvl => slotLevels().find(l => l >= lvl && slotLeft(l) > 0) || null;
const spellById = id => (CH.spells || []).find(s => s.id === id);
const pool      = f => (f.spend ? byId[f.spend.id] : null);
const spendLeft = f => { const p = pool(f); return p ? Math.floor(usesLeft(p) / (f.spend.cost || 1)) : 0; };

/* ---------- состояние ---------- */
const freshTurn  = () => ({ action: null, bonus: null });
const freshState = () => ({ hp: CH.hp.max, temp: 0, round: 1, used: {}, slots: {}, hitDiceUsed: 0, turn: freshTurn(),
  conc: null, conds: [], death: { s: 0, f: 0 }, insp: false, notes: "" });
// [[ключ|текст]] → просто текст (внутри кнопок подчёркнутые слова не нужны)
const plainText  = s => String(s).replace(/\[\[[a-z0-9-]+\|([^\]]+)\]\]/g, "$1");
function load(){
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s && typeof s.hp === "number"){ const st = Object.assign(freshState(), s); st.hp = Math.min(st.hp, CH.hp.max); return st; }
  } catch (e) {}
  return freshState();
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
const setHP = n => {
  const was = S.hp;
  S.hp = Math.max(0, Math.min(CH.hp.max, n));
  if (S.hp > 0) S.death = { s: 0, f: 0 };
  // без сознания концентрацию не удержать
  if (S.hp === 0 && was > 0 && S.conc){ const c = S.conc.name; S.conc = null; setTimeout(() => toast(`Хиты на нуле: концентрация на «${c}» потеряна.`), 0); }
};
// Урон: сначала снимает временные хиты, а при концентрации напоминает о спасброске
function takeDamage(n){
  if (n <= 0) return;
  const absorbed = Math.min(S.temp || 0, n);
  S.temp = (S.temp || 0) - absorbed;
  const rest = n - absorbed;
  const conc = S.conc && rest + absorbed > 0 ? S.conc.name : null;
  setHP(S.hp - rest);
  const parts = [];
  if (absorbed) parts.push(`${absorbed} ушло во временные хиты`);
  if (conc && S.hp > 0) parts.push(`концентрация на «${conc}»: спасбросок Телосложения Сл ${Math.max(10, Math.floor(n / 2))}, провал — заклинание гаснет`);
  if (parts.length) toast(`Урон ${n}: ${parts.join("; ")}.`);
}
const snap  = () => { snapshot = JSON.parse(JSON.stringify(S)); };

/* ---------- кусочки разметки ---------- */
function card(f){
  let b = "";
  if (f.kind === "movement") b += `<div class="move"><b>${squares()}</b><span>клеток за ход<br>${CH.speed} футов</span></div>`;
  if (f.plain) b += `<p class="plain">${rich(f.plain)}</p>`;
  else if (!f.attack && !f.attackRef) b += `<p class="meta">Описания нет, уточни у мастера.</p>`;
  if (f.attack || f.attackRef){
    const a = attackOf(f);
    b += `<div class="chips">
      <span class="chip"><span class="cl">Попадание</span><b>${showF(d20(a.toHit))}</b></span>
      <span class="chip"><span class="cl">Урон</span><b>${showF(a.damage)}</b>${a.damageType ? `<span class="cu">${esc(a.damageType)}</span>` : ""}</span>
      ${a.alt ? `<span class="chip"><span class="cl">Двумя руками</span><b>${esc(a.alt.replace(/ двумя руками$/, ""))}</b></span>` : ""}
    </div>`;
    if (a.range) b += `<p class="meta">Дальность: ${rich(a.range)}</p>`;
  }
  if (f.heal) b += `<div class="chips"><span class="chip"><span class="cl">Лечит</span><b>${showF(f.heal)}</b><span class="cu">хитов</span></span></div>`;
  if (f.save || f.dmg) b += `<div class="chips">${saveChip(f.save)}${dmgChip(f.dmg)}</div>`;
  if (f.why)  b += `<details class="why"><summary>Откуда числа</summary><p>${rich(f.why)}</p></details>`;
  if (f.uses) b += `<div class="use" id="u-${f.id}"></div>`;
  if (f.spend && pool(f)) b += `<div class="spend" id="sp-${f.id}"></div>`;
  return `<article class="ab card" data-kind="${f.kind}" id="f-${f.id}">
    <div class="ab-h"><h3>${esc(f.name)}</h3><span class="src">${esc(f.source)}</span></div>${b}
  </article>`;
}

const saveChip = sv => sv ? `<span class="chip"><span class="cl">${term("save", "Спасбросок")}</span><b>${ABBR[sv.ab]} ${sv.dc}</b>${sv.half ? `<span class="cu">успех — половина</span>` : ""}</span>` : "";
const dmgChip  = d => d ? `<span class="chip"><span class="cl">Урон</span><b>${showF(d.dice)}</b>${d.type ? `<span class="cu">${esc(d.type)}</span>` : ""}</span>` : "";

/* Карточка заклинания */
const CIRCLE = l => l === 0 ? "заговор" : `${l} круг`;
function spellCard(sp){
  const K = KINDS[sp.kind] || KINDS.action;
  let b = `<div class="badges"><span class="badge kind"><i aria-hidden="true"></i>${K.term ? term(K.term, K.name) : esc(K.name)}</span>${sp.conc ? `<span class="badge conc">${term("concentration", "Концентрация")}</span>` : ""}${sp.ritual ? `<span class="badge">${term("ritual", "Ритуал")}</span>` : ""}${sp.always ? `<span class="badge">всегда подготовлено</span>` : ""}</div>`;
  b += `<p class="plain">${rich(sp.plain)}</p>`;
  const chips = [];
  if (sp.attack) chips.push(`<span class="chip"><span class="cl">${term("spell-attack", "Попадание")}</span><b>${showF(d20(sp.attack.toHit))}</b></span>`,
    `<span class="chip"><span class="cl">Урон${sp.count ? ` ×${sp.count}` : ""}</span><b>${showF(sp.attack.damage)}</b>${sp.attack.damageType ? `<span class="cu">${esc(sp.attack.damageType)}</span>` : ""}</span>`);
  if (sp.save) chips.push(saveChip(sp.save));
  if (sp.dmg) chips.push(`<span class="chip"><span class="cl">Урон${sp.count ? ` ×${sp.count}` : ""}</span><b>${showF(sp.dmg.dice)}</b>${sp.dmg.type ? `<span class="cu">${esc(sp.dmg.type)}</span>` : ""}</span>`);
  if (sp.heal) chips.push(`<span class="chip"><span class="cl">Лечит</span><b>${showF(sp.heal)}</b><span class="cu">хитов</span></span>`);
  if (sp.sleep) chips.push(`<span class="chip"><span class="cl">Усыпляет</span><b>${showF(sp.sleep)}</b><span class="cu">хитов существ</span></span>`);
  if (chips.length) b += `<div class="chips">${chips.join("")}</div>`;
  b += `<p class="meta">Дальность: ${esc(sp.range)} · длится: ${esc(sp.dur)}${sp.upcast ? `. ${esc(sp.upcast)}` : ""}${sp.healNote ? ` ${esc(sp.healNote)}` : ""}${sp.castNote ? ` ${esc(sp.castNote)}` : ""}</p>`;
  if (sp.level > 0 && slotLevels().length) b += `<div class="cast" id="c-${sp.id}"></div>`;
  return `<article class="ab card" data-kind="${sp.kind}" id="s-${sp.id}">
    <div class="ab-h"><h3>${esc(sp.name)}</h3>${sp.source ? `<span class="src">${esc(sp.source)}</span>` : ""}</div>${b}
  </article>`;
}

function commonActions(){
  const armorDis = CH.equipment.some(e => e.stealthDisadvantage);
  const items = KB.commonActions.map(c => {
    let extra = "";
    if (c.skill){
      const s = skill(c.skill);
      extra = ` ${esc(s.name)} <b>${sg(skillB(s))}</b>${c.skill === "stealth" && armorDis ? ", в этом доспехе с помехой" : ""}.`;
    }
    return `<div class="ca"><dt>${esc(c.name)}</dt><dd>${rich(c.plain)}${extra}</dd></div>`;
  }).join("");
  return `<details class="common card"><summary><span>Ещё действия, доступные любому герою</span><span class="chev" aria-hidden="true"></span></summary><dl>${items}</dl></details>`;
}

/* Заклинания внутри секции хода: по ленте на каждый круг, листаются вбок */
function spellRows(spells){
  return [0, 1, 2, 3, 4, 5].map(l => {
    const ls = spells.filter(sp => sp.level === l);
    if (!ls.length) return "";
    return `<div class="srow">
      <div class="srow-h"><b>${l === 0 ? term("cantrip", "Заговоры") : `Заклинания ${l} круга`}</b><span class="srow-n">${l === 0 ? "бесплатно" : `<span class="slh" data-l="${l}"></span>`}</span>${ls.length > 1 ? `<span class="srow-hint">${ls.length} · листай →</span>` : ""}</div>
      <div class="hscroll">${ls.map(spellCard).join("")}</div>
    </div>`;
  }).join("");
}
function group(kind, list, spells = []){
  if (!list.length && !spells.length) return "";
  const K = KINDS[kind];
  return `<section class="sec" data-kind="${kind}">
    <div class="sec-h"><h2><span class="dot" aria-hidden="true"></span>${K.term ? term(K.term, K.name) : esc(K.name)}</h2><p>${K.note}</p></div>
    ${list.map(card).join("")}
    ${kind === "action" ? commonActions() : ""}
    ${spellRows(spells)}
  </section>`;
}

function savesSec(combat){
  const rows = Object.entries(KB.abilities).map(([a, m]) =>
    `<div class="sv${CH.saves.includes(a) ? " strong" : ""}"><span>${esc(m.name)}</span><b>${sg(saveB(a))}</b></div>`).join("");
  const ath = skill("athletics"), acr = skill("acrobatics");
  return `<section class="sec">
    <div class="sec-h"><h2>${term("save", "Спасброски")}</h2><p>Мастер называет характеристику — бросай к20 и прибавляй число. Зелёная точка: в этом ты ${gf("натренирована", "натренирован")}.</p></div>
    <div class="card saves">${rows}</div>
    ${combat ? `<p class="mini">${term("grapple", "Захват и толчок")}: <span>Атлетика <b>${sg(skillB(ath))}</b></span><span>Акробатика <b>${sg(skillB(acr))}</b></span></p>` : ""}
  </section>`;
}

/* Магия внутри боевки: атака заклинанием, сложность и ячейки */
function magicBlock(){
  const sc = SC();
  if (!sc) return "";
  const ABN = { str: "Силу", dex: "Ловкость", con: "Телосложение", int: "Интеллект", wis: "Мудрость", cha: "Харизму" };
  const levels = slotLevels();
  return `<div class="stats2">
      <div class="tile card"><span class="tl">${term("spell-attack", "Атака заклинанием")}</span><span class="tv">${sg(sc.attack)}</span><span class="ts">Прибавляй к к20, когда заклинание просит попасть</span></div>
      <div class="tile card"><span class="tl">${term("spell-dc", "Сложность спасброска")}</span><span class="tv">${sc.dc}</span><span class="ts">Враг спасается, если выбросит ${sc.dc} или больше</span></div>
    </div>
    ${levels.length ? `<div class="card slots">
      <p class="slots-h">${term("spell-slot", "Ячейки заклинаний")} <span>вернутся после ${sc.recharge === "short" ? "короткого" : "длинного"} отдыха</span></p>
      ${levels.map(l => `<div class="slot-row" id="sl-${l}"></div>`).join("")}

}

/* Обновляет всё, что меняется во время игры */
function refresh(){
  const low = S.hp <= Math.floor(CH.hp.max / 4);
  $("#hpCur").textContent = S.hp;
  $("#hpCur").classList.toggle("low", low);
  $("#hpBar").classList.toggle("low", low);
  $$("#hpBar button").forEach((b, i) => b.classList.toggle("off", i >= S.hp));

  const fill = $("#hpFill");
  if (fill){ fill.style.width = `${(S.hp / CH.hp.max) * 100}%`; $("#hpBar").setAttribute("aria-valuenow", S.hp); }

  const down = $("#down");
  if (S.hp === 0){
    const rel = CH.features.find(f => f.trigger === "zero-hp");
    down.hidden = false;
    if (rel && usesLeft(rel) > 0){
      down.innerHTML = `<p>Хиты на нуле. Но срабатывает «${esc(rel.name)}», и ты остаёшься на ногах.</p>
         <button type="button" class="btn primary" data-act="use" data-id="${rel.id}">Встать с 1 хитом</button>`;
    } else {
      const d = S.death || { s: 0, f: 0 };
      const pips = (n, cls) => Array.from({ length: 3 }, (_, i) => `<i class="${i < n ? "on" : ""}"></i>`).join("");
      const state = d.f >= 3 ? "Три провала: герой погиб. Поговори с мастером." : d.s >= 3 ? "Три успеха: ты стабилен, но без сознания. Очнёшься через 1к4 часа или когда тебя подлечат." : "";
      down.innerHTML = `<p>Ты без сознания. В начале каждого своего хода бросай ${term("death-save", "спасбросок от смерти")}: к20, 10 и выше — успех. 1 — два провала, 20 — встаёшь с 1 хитом. Урон по тебе — провал.</p>
        <div class="ds"><div class="ds-row ok"><span>Успехи</span>${pips(d.s)}</div><div class="ds-row bad"><span>Провалы</span>${pips(d.f)}</div></div>
        ${state ? `<p><b>${state}</b></p>` : `<div class="ds-btns">
          <button type="button" class="btn primary" data-act="death" data-v="s">Успех</button>
          <button type="button" class="btn danger" data-act="death" data-v="f">Провал</button>
          <button type="button" class="btn neutral" data-act="death" data-v="20">Выпало 20</button>
        </div>`}
        <button type="button" class="btn neutral" data-act="death" data-v="reset">Сбросить отметки</button>`;
    }
  } else {
    down.hidden = true;
  }

  // Концентрация: какое заклинание сейчас держишь
  const conds = $("#conds");
  if (conds){
    conds.innerHTML = S.conc ? `<div class="cond conc"><div><b>${term("concentration", "Концентрация")}: ${esc(S.conc.name)}</b><p>Получишь урон — спасбросок Телосложения. Новое заклинание с концентрацией сбросит это.</p></div><button type="button" class="x" data-act="concOff" aria-label="Сбросить концентрацию">×</button></div>` : "";
    conds.hidden = !S.conc;
  }
  // Сколько ячеек хватит на заклинания каждого круга (годится и ячейка выше)
  $$(".slh").forEach(el => {
    const l = +el.dataset.l, n = slotLevels().filter(k => k >= l).reduce((a, k) => a + slotLeft(k), 0);
    el.textContent = n ? `ячеек хватит на ${n}` : "ячейки кончились";
  });
  const ib = $("#inspBtn");
  if (ib) ib.setAttribute("aria-pressed", String(!!S.insp));

  CH.features.filter(f => f.uses).forEach(f => {
    const el = $("#u-" + f.id);
    if (!el) return;
    const l = usesLeft(f);
    const when = f.uses.recharge === "short" ? term("short-rest", "короткого отдыха") : term("long-rest", "длинного отдыха");
    el.innerHTML = `<div class="use-info"><span class="pips">${Array.from({ length: f.uses.max }, (_, i) => `<i class="${i < l ? "full" : ""}"></i>`).join("")}</span>
        <span>${f.uses.max > 1 ? `${l} из ${f.uses.max}` : l > 0 ? "Готово" : "Потрачено"} · вернётся после ${when}</span></div>
      ${f.uses.max > 1
        ? `<span class="use-btns">${l < f.uses.max ? `<button type="button" class="btn neutral" data-act="unuse" data-id="${f.id}">Вернуть</button>` : ""}${l > 0 ? `<button type="button" class="btn primary" data-act="use" data-id="${f.id}">Использовать</button>` : ""}</span>`
        : `<button type="button" class="btn ${l > 0 ? "primary" : "neutral"}" data-act="use" data-id="${f.id}">${l > 0 ? "Использовать" : "Вернуть"}</button>`}`;
    $("#f-" + f.id).classList.toggle("spent", l <= 0);
  });

  // Приёмы, которые тратят общий запас (ки, вдохновение, божественный канал)
  CH.features.filter(f => f.spend && pool(f)).forEach(f => {
    const el = $("#sp-" + f.id);
    if (!el) return;
    const p = pool(f), cost = f.spend.cost || 1, can = usesLeft(p) >= cost;
    el.innerHTML = `<span class="meta">Тратит ${cost} из «${esc(p.name)}» · осталось ${usesLeft(p)} из ${p.uses.max}</span>
      <button type="button" class="btn ${can ? "primary" : "neutral"}" data-act="spend" data-id="${f.id}"${can ? "" : " disabled"}>${can ? "Использовать" : "Нечем"}</button>`;
  });
  // Ячейки заклинаний
  slotLevels().forEach(l => {
    const el = $("#sl-" + l);
    if (!el) return;
    const left = slotLeft(l), max = slotMax(l);
    el.innerHTML = `<b>${l} круг</b><div class="use-info"><span class="pips">${Array.from({ length: max }, (_, i) => `<i class="${i < left ? "full" : ""}"></i>`).join("")}</span><span>${left} из ${max}</span></div>
      <span class="use-btns">${left < max ? `<button type="button" class="btn neutral" data-act="slotBack" data-l="${l}">Вернуть</button>` : ""}${left > 0 ? `<button type="button" class="btn primary" data-act="slotUse" data-l="${l}">Потратить</button>` : ""}</span>`;
  });
  (CH.spells || []).filter(sp => sp.level > 0).forEach(sp => {
    const el = $("#c-" + sp.id);
    if (!el) return;
    const l = slotFor(sp.level);
    el.innerHTML = `<span class="meta">${l ? `Потратит ячейку ${l} круга` : `Ячеек ${sp.level} круга и выше не осталось`}${sp.ritual ? ". Ритуалом — без ячейки, но на 10 минут дольше" : ""}</span>
      <button type="button" class="btn ${l ? "primary" : "neutral"}" data-act="cast" data-id="${sp.id}"${l ? "" : " disabled"}>Сотворить</button>`;
  });

  ["action", "bonus"].forEach(slot => {
    const t = $(`.tok[data-slot="${slot}"]`);
    if (t) t.dataset.spent = String(!!S.turn[slot]);
  });
  const now = [S.turn.action, S.turn.bonus].filter(Boolean).map(c => c.name);
  $("#turnNow").innerHTML = `<b>Раунд ${S.round || 1}</b>${(S.round || 1) > 1 ? ` <button type="button" class="linkbtn" data-act="roundReset">конец боя</button>` : ""}<br>${esc(now.length ? "В этом ходу: " + now.join(" · ") : "Ещё ничего не выбрано")}`;

  themeIcon();
  if (drawerMode && drawerMode.startsWith("rest-") && $("#drawer").open) renderRest(drawerMode.slice(5));
  if (drawerMode && drawerMode.startsWith("slot-") && $("#drawer").open) renderSlot(drawerMode.slice(5));

  save();
}

/* ---------- вкладки ---------- */
const TABS = ["stats", "combat", "gear"];
function setTab(id, scroll){
  if (id === "magic") id = "combat";
  if (!TABS.includes(id)) id = "stats";
  $$(".panel").forEach(p => { p.hidden = p.id !== "p-" + id; });
  $$(".tab").forEach(t => t.setAttribute("aria-selected", String(t.dataset.tab === id)));

  if (scroll){
    const y = $("#panels").getBoundingClientRect().top + window.scrollY - 16;
    if (window.scrollY > y) window.scrollTo({ top: y });

/* ---------- подсказка снизу ---------- */
let toastTimer;
function toast(msg, undo = false){
  const el = $("#toast");
  $("#tMsg").textContent = msg;
  $("#tUndo").hidden = !undo;
  $("#toastWrap").hidden = false;
  el.classList.remove("pop"); void el.offsetWidth; el.classList.add("pop");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { $("#toastWrap").hidden = true; snapshot = null; }, undo ? 7000 : 5000);
}

/* ---------- шторка: словарик и кость хитов ---------- */
const drawer = $("#drawer");
function openDrawer(){ if (!drawer.open){ try { drawer.showModal(); } catch (e) { drawer.setAttribute("open", ""); } } }
function openTerm(k){

/* Шторка отдыха: сначала объяснение и что вернётся, потом кнопка «отдохнуть».
   В коротком отдыхе ещё и кость хитов. */
const retRow = (name, state, back) => `<div class="ret-row${back ? " back" : ""}"><span>${esc(name)}</span><em>${esc(state)}</em></div>`;
function renderRest(kind){
  const isS = kind === "short";
  const rows = [];
  if (!isS) rows.push(retRow("Хиты", S.hp < CH.hp.max ? `${S.hp} → ${CH.hp.max}` : "уже полные", S.hp < CH.hp.max));
  CH.features.filter(f => f.uses && (!isS || f.uses.recharge === "short")).forEach(f => {
    const spent = usesLeft(f) < f.uses.max;
    rows.push(retRow(f.name, spent ? "вернётся" : "уже готово", spent));
  });
  if (slotLevels().length && (!isS || SC().recharge === "short")){
    const spent = slotLevels().some(l => slotLeft(l) < slotMax(l));
    rows.push(retRow("Ячейки заклинаний", spent ? "вернутся" : "уже готовы", spent));
  }
  if (!isS) rows.push(retRow("Кость хитов", S.hitDiceUsed > 0 ? "вернётся" : "уже на месте", S.hitDiceUsed > 0));

  $("#drTitle").textContent = isS ? "Короткий отдых" : "Длинный отдых";
  let html = `<p>${isS
    ? "Около часа передышки: перевязать раны, перекусить, перевести дух. Группа говорит мастеру, что отдыхает."
    : "Ночёвка, не меньше 8 часов. Постоять в карауле можно, а если ночью случится бой, отдых прерывается."}</p>
    <h4 class="dr-sub">Что вернётся</h4><div class="ret">${rows.join("")}</div>`;

  if (isS){
    const l = hdLeft();
    html += `<div class="dr-block">
      <div class="dr-block-h"><b>Кость хитов</b><span class="meta">по желанию</span></div>
      <p class="meta">Бросаешь кость, прибавляешь Телосложение и возвращаешь столько хитов. Потраченные кости вернутся после длинного отдыха.</p>
      <div class="dr-stats">
        <div class="dr-stat"><span>Твоя кость</span><b>${showF(hitDieF())}</b></div>
        <div class="dr-stat"><span>Осталось</span><b>${l} из ${CH.hitDice.count}</b></div>
      </div>
      ${l < CH.hitDice.count ? `<p class="hd-note">Брось ${showF(hitDieF())} и добавь выпавшие хиты кнопкой «+» на вкладке «Боевка».</p>` : ""}
      <button type="button" class="btn wide neutral" data-act="hdtoggle">${l > 0 ? "Потратить кость" : "Вернуть кость"}</button>
    </div>`;
  }
  html += `<button type="button" class="btn wide primary" data-act="${isS ? "restShort" : "restLong"}">${isS ? "Отдохнуть часок" : "Переночевать"}</button>`;
  $("#drBody").innerHTML = html;
}
/* Подсказка после заклинания: что бросать */
function spellToast(sp, l){
  const parts = [sp.name + (l ? ` (ячейка ${l} круга)` : "")];
  if (sp.attack) parts.push(`брось ${showF(d20(sp.attack.toHit))} на попадание, ${gf("попала", "попал")} — ${showF(sp.attack.damage)}${sp.count ? ` за каждый из ${sp.count}` : ""}`);
  else if (sp.save) parts.push(`цель спасается: ${ABBR[sp.save.ab]} против ${sp.save.dc}${sp.dmg ? `, урон ${showF(sp.dmg.dice)}` : ""}`);
  else if (sp.dmg) parts.push(`урон ${showF(sp.dmg.dice)}${sp.count ? ` × ${sp.count}` : ""}`);
  if (sp.heal) parts.push(`лечит ${showF(sp.heal)}`);
  return parts[0] + (parts.length > 1 ? ": " + parts.slice(1).join(", ") : "") + ".";
}
// Заклинание с концентрацией становится текущим; прежнее гаснет
function startConc(sp){
  if (!sp.conc) return "";
  const prev = S.conc && S.conc.id !== sp.id ? S.conc.name : null;
  S.conc = { id: sp.id, name: sp.name };
  return prev ? ` Концентрация на «${prev}» сброшена.` : " Держишь концентрацию.";
}
/* Шторка выбора: что можно сделать действием или бонусным действием */
function optFeature(f, slot){
  const left = f.uses ? usesLeft(f) : f.spend && pool(f) ? spendLeft(f) : 1;
  let chips = "";
  if (f.attack || f.attackRef){
    const a = attackOf(f);
    chips = `<span class="chips"><span class="chip"><span class="cl">Попадание</span><b>${showF(d20(a.toHit))}</b></span><span class="chip"><span class="cl">Урон</span><b>${showF(a.damage)}</b></span></span>`;
  }
  if (f.heal) chips = `<span class="chips"><span class="chip"><span class="cl">Лечит</span><b>${showF(f.heal)}</b><span class="cu">хитов</span></span></span>`;
  const note = f.uses && left <= 0
    ? `<span class="opt-d">Потрачено · вернётся после ${f.uses.recharge === "short" ? "короткого" : "длинного"} отдыха</span>`
    : f.spend && pool(f) ? `<span class="opt-d">Тратит ${f.spend.cost || 1} из «${esc(pool(f).name)}»${left <= 0 ? " — не осталось" : ""}</span>` : "";
  return `<button type="button" class="opt" data-act="pick" data-slot="${slot}" data-id="${f.id}"${left <= 0 ? " disabled" : ""}><span class="opt-n">${esc(f.name)}</span>${chips}${note}</button>`;
}
function optSpell(sp, slot){
  const l = sp.level ? slotFor(sp.level) : 0;
  const off = sp.level > 0 && !l;
  const chips = [];
  if (sp.attack) chips.push(`<span class="chip"><span class="cl">Попадание</span><b>${showF(d20(sp.attack.toHit))}</b></span><span class="chip"><span class="cl">Урон</span><b>${showF(sp.attack.damage)}</b></span>`);
  if (sp.save) chips.push(`<span class="chip"><span class="cl">Спасбросок</span><b>${ABBR[sp.save.ab]} ${sp.save.dc}</b></span>`);
  if (sp.dmg) chips.push(`<span class="chip"><span class="cl">Урон</span><b>${showF(sp.dmg.dice)}</b></span>`);
  if (sp.heal) chips.push(`<span class="chip"><span class="cl">Лечит</span><b>${showF(sp.heal)}</b></span>`);
  return `<button type="button" class="opt" data-act="pick" data-slot="${slot}" data-spell="${sp.id}"${off ? " disabled" : ""}><span class="opt-n">${esc(sp.name)}</span>${chips.length ? `<span class="chips">${chips.join("")}</span>` : ""}<span class="opt-d">${sp.level ? (l ? `${CIRCLE(sp.level)} · потратит ячейку ${l} круга` : "Ячеек не осталось") : "заговор · бесплатно"}${sp.conc ? " · концентрация" : ""}</span></button>`;
}
function renderSlot(slot){
  const isA = slot === "action", chosen = S.turn[slot];
  $("#drTitle").textContent = isA ? "Действие" : "Бонусное действие";
  if (chosen){
    $("#drBody").innerHTML = `
      <p>В этом ходу уже выбрано: <b>${esc(chosen.name)}</b>.</p>
      <p class="meta">Следующее будет в новом ходу.${chosen.consumed || chosen.spent ? ` Отмена вернёт и потраченное.` : chosen.slotLevel ? ` Отмена вернёт ячейку ${chosen.slotLevel} круга.` : ""}</p>
      <button type="button" class="btn wide neutral" data-act="unpick" data-slot="${slot}">Отменить выбор</button>`;
    return;
  }
  const feats = CH.features.filter(f => f.kind === slot && scene(f) === "combat");
  const spells = (CH.spells || []).filter(sp => sp.kind === slot);
  const spellsHtml = spells.length ? `<h4 class="dr-sub">Заклинания</h4><div class="opts">${spells.map(sp => optSpell(sp, slot)).join("")}</div>` : "";
  let html = `<p class="meta">${isA ? "Одно за ход. Выбери, что делаешь." : "Одно за ход, если есть способность на него."}</p>`;
  if (isA){
    html += `${feats.length ? `<h4 class="dr-sub">Твои атаки и умения</h4><div class="opts">${feats.map(f => optFeature(f, slot)).join("")}</div>` : ""}${spellsHtml}
      <h4 class="dr-sub">Что ещё можно</h4><div class="opts">${KB.commonActions.map((c, i) =>
        `<button type="button" class="opt" data-act="pick" data-slot="action" data-ca="${i}"><span class="opt-n">${esc(c.name)}</span><span class="opt-d">${esc(plainText(c.plain))}</span></button>`).join("")}</div>`;
  } else {
    html += feats.length || spells.length
      ? `${feats.length ? `<div class="opts">${feats.map(f => optFeature(f, slot)).join("")}</div>` : ""}${spellsHtml}`
      : `<p>Бонусных действий у тебя пока нет.</p>`;
  }
  $("#drBody").innerHTML = html;
}

$("#drClose").addEventListener("click", () => drawer.close());
drawer.addEventListener("click", e => { if (e.target === drawer) drawer.close(); });
drawer.addEventListener("close", () => { drawerMode = null; });

/* ---------- что делает каждая кнопка ---------- */
const H = {
  "hp-": () => takeDamage(1),
  "hp+": () => setHP(S.hp + 1),
  hpmeter: (b, e) => {
    const r = b.getBoundingClientRect();
    const x = e && typeof e.clientX === "number" ? e.clientX : r.right;
    setHP(Math.round(Math.max(0, Math.min(1, (x - r.left) / r.width)) * CH.hp.max));
  },
  death: b => {
    const d = S.death || (S.death = { s: 0, f: 0 }), v = b.dataset.v;
    if (v === "s") d.s = Math.min(3, d.s + 1);
    else if (v === "f") d.f = Math.min(3, d.f + 1);
    else if (v === "20"){ setHP(1); toast("Двадцать! Ты приходишь в себя с 1 хитом."); }
    else S.death = { s: 0, f: 0 };
  },
  concOff: () => { if (S.conc) toast(`Концентрация на «${S.conc.name}» сброшена.`); S.conc = null; },
  insp: () => {
    S.insp = !S.insp;
    toast(S.insp ? "Вдохновение! Потрать его, чтобы бросить любую атаку, проверку или спасбросок с преимуществом. Его дарит мастер за яркую игру." : "Вдохновение потрачено.");
  },
  print: () => {
    $$(".panel").forEach(p => { p.hidden = false; });
    $$("details").forEach(d => { d.dataset.wasOpen = d.open; d.open = true; });
    window.print();
  },
  wipe: () => {
    snap();
    const notes = S.notes;
    S = freshState();
    toast("Всё как в начале: полные хиты, способности на месте, заметки очищены.", true);
    snapshot.notes = notes;
    const n = $("#notes"); if (n) n.value = "";
  },
  helloDone: () => { try { localStorage.setItem(HELLO_KEY, "1"); } catch (e) {} const h = $("#hello"); if (h) h.remove(); },
  hpset: b => { const i = +b.dataset.i; setHP(S.hp === i ? i - 1 : i); },

  // «Использовать» тратит, повторное нажатие («Вернуть») возвращает
  use: b => {
    const f = byId[b.dataset.id];
    if (usesLeft(f) > 0){
      S.used[f.id] = (S.used[f.id] || 0) + 1;
      if (f.kind === "bonus" && !S.turn.bonus) S.turn.bonus = { id: f.id, name: f.name, consumed: true };
      if (f.grantsAction){ S.turn.action = null; toast(`${f.name}: ещё одно действие в этом ходу. Выбери его на панели хода.`); }
      if (f.trigger === "zero-hp" && S.hp === 0){ S.hp = 1; toast(`${f.name}: ты на ногах с 1 хитом.`); }
      else if (f.heal) toast(`Брось ${showF(f.heal)} и добавь столько хитов кнопкой «+».`);
    } else {
      S.used[f.id] = Math.max(0, (S.used[f.id] || 0) - 1);
      if (S.turn.bonus && S.turn.bonus.id === f.id) S.turn.bonus = null;
    }
  },

  spend: b => {
    const f = byId[b.dataset.id], p = pool(f), cost = f.spend.cost || 1;
    if (!p || usesLeft(p) < cost) return;
    S.used[p.id] = (S.used[p.id] || 0) + cost;
    toast(`${f.name}: потрачено ${cost} из «${p.name}». Осталось ${usesLeft(p)}.`);
  },
  slotUse:  b => { const l = +b.dataset.l; if (slotLeft(l) > 0) S.slots[l] = (S.slots[l] || 0) + 1; },
  slotBack: b => { const l = +b.dataset.l; S.slots[l] = Math.max(0, (S.slots[l] || 0) - 1); },
  cast: b => {
    const sp = spellById(b.dataset.id), l = slotFor(sp.level);
    if (!l) return;
    S.slots[l] = (S.slots[l] || 0) + 1;
    if ((sp.kind === "action" || sp.kind === "bonus") && !S.turn[sp.kind]) S.turn[sp.kind] = { spell: sp.id, name: sp.name, slotLevel: l };
    toast(spellToast(sp, l) + startConc(sp));
  },

  unuse: b => {
    const f = byId[b.dataset.id];
    S.used[f.id] = Math.max(0, (S.used[f.id] || 0) - 1);
    if (S.turn.bonus && S.turn.bonus.id === f.id) S.turn.bonus = null;
  },

  // Панель хода
  slot: b => { drawerMode = "slot-" + b.dataset.slot; renderSlot(b.dataset.slot); openDrawer(); },
  abil: b => { drawerMode = "abil"; renderAbil(b.dataset.a); openDrawer(); drawer.scrollTop = 0; },
  dict: () => { drawerMode = "dict"; renderDict(); openDrawer(); drawer.scrollTop = 0; },
  pick: b => {
    const slot = b.dataset.slot;
    if (S.turn[slot]) return;
    if (b.dataset.ca !== undefined){
      const c = KB.commonActions[+b.dataset.ca];
      S.turn[slot] = { name: c.name };
      toast(`${c.name}. ${plainText(c.plain)}`);
    } else if (b.dataset.spell){
      const sp = spellById(b.dataset.spell);
      let l = 0;
      if (sp.level){ l = slotFor(sp.level); if (!l) return; S.slots[l] = (S.slots[l] || 0) + 1; }
      S.turn[slot] = { spell: sp.id, name: sp.name, slotLevel: l };
      toast(spellToast(sp, l) + startConc(sp));
    } else {
      const f = byId[b.dataset.id];
      let consumed = false, spent = null;
      if (f.uses){
        if (usesLeft(f) <= 0) return;
        S.used[f.id] = (S.used[f.id] || 0) + 1;
        consumed = true;
      } else if (f.spend && pool(f)){
        if (spendLeft(f) <= 0) return;
        const p = pool(f);
        S.used[p.id] = (S.used[p.id] || 0) + (f.spend.cost || 1);
        spent = { id: p.id, n: f.spend.cost || 1 };
      }
      S.turn[slot] = { id: f.id, name: f.name, consumed, spent };
      if (f.attack || f.attackRef){
        const a = attackOf(f);
        toast(`${f.name}: брось ${showF(d20(a.toHit))} на попадание. ${gf("Попала", "Попал")} — ${showF(a.damage)} урона.`);
      } else if (f.heal){
        toast(`${f.name}: брось ${showF(f.heal)} и добавь столько хитов кнопкой «+».`);
      }
    }
    drawer.close();
  },
  unpick: b => {
    const slot = b.dataset.slot, c = S.turn[slot];
    if (!c) return;
    if (c.consumed && c.id) S.used[c.id] = Math.max(0, (S.used[c.id] || 0) - 1);
    if (c.spent) S.used[c.spent.id] = Math.max(0, (S.used[c.spent.id] || 0) - c.spent.n);
    if (c.slotLevel) S.slots[c.slotLevel] = Math.max(0, (S.slots[c.slotLevel] || 0) - 1);
    S.turn[slot] = null;
  },
  newturn: () => {
    S.turn = freshTurn();
    S.round = (S.round || 1) + 1;
    toast(`Раунд ${S.round}. Действие и бонусное снова доступны.${S.round === 11 ? " Прошла минута: заклинания «на 1 минуту» закончились." : ""}`);
  },
  roundReset: () => { S.round = 1; S.turn = freshTurn(); toast("Бой закончен: счёт раундов сброшен."); },

  // Отдых: кнопки наверху открывают шторку, отдых случается по кнопке внутри
  short: () => { drawerMode = "rest-short"; renderRest("short"); openDrawer(); },
  long:  () => { drawerMode = "rest-long";  renderRest("long");  openDrawer(); },
  restShort: () => {
    snap();
    const back = CH.features.filter(f => f.uses && f.uses.recharge === "short" && S.used[f.id]);
    back.forEach(f => { S.used[f.id] = 0; });
    const slotsBack = SC() && SC().recharge === "short" && slotLevels().some(l => slotLeft(l) < slotMax(l));
    if (slotsBack){ S.slots = {}; back.push({ name: "ячейки заклинаний" }); }
    S.turn = freshTurn();
    drawer.close();
    toast(back.length
      ? `Короткий отдых. Снова готово: ${back.map(f => f.name).join(", ")}.`
      : "Короткий отдых. Всё и так было готово.", true);
  },
  restLong: () => {
    snap();
    S.hp = CH.hp.max; S.used = {}; S.slots = {}; S.hitDiceUsed = 0; S.turn = freshTurn();
    S.temp = 0; S.conc = null; S.death = { s: 0, f: 0 }; S.round = 1;
    drawer.close();
    toast(`Длинный отдых. Хиты полные, способности${slotLevels().length ? ", ячейки" : ""} и кость хитов вернулись.`, true);
  },
  undo: () => {
    if (!snapshot) return;
    S = snapshot; snapshot = null;
    const n = $("#notes"); if (n) n.value = S.notes || "";
    toast("Отменено.");
  },

  // Кость хитов живёт внутри шторки короткого отдыха: нажал — потратил, ещё раз — вернул
  hdtoggle: () => {
    if (hdLeft() > 0) S.hitDiceUsed++;
    else S.hitDiceUsed = Math.max(0, S.hitDiceUsed - 1);
  },

  theme: () => {
    const next = effTheme() === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
  }
};

document.addEventListener("click", e => {
  if (!CH) return;
  const tab = e.target.closest("[data-tab]");
  if (tab){ setTab(tab.dataset.tab, true); return; }
  const t = e.target.closest("[data-term]");
  if (t){ openTerm(t.dataset.term); return; }
  const b = e.target.closest("[data-act]");
  if (!b || !H[b.dataset.act]) return;
  H[b.dataset.act](b, e);
  refresh();
});
// После печати возвращаем вкладки как были
window.addEventListener("afterprint", () => {
  let cur = "stats"; try { cur = localStorage.getItem(TAB_KEY) || "stats"; } catch (e) {}
  setTab(cur, false);
  $$("details").forEach(d => { if (d.dataset.wasOpen !== undefined){ d.open = d.dataset.wasOpen === "true"; delete d.dataset.wasOpen; } });
});
// Заметки сохраняются на лету, без перерисовки
document.addEventListener("input", e => {
  if (e.target.id === "notes" && S){ S.notes = e.target.value; save(); }
});


/* ---------- запуск: откуда брать персонажа ---------- */
const getJSON = url => fetch(url).then(r => { if (!r.ok) throw new Error(r.status + " " + url); return r.json(); });

// /c/код → персонаж из базы. Функция в базе отдаёт ровно одного персонажа по коду.
async function loadCharacter(){
  if (/^\/preview\/?$/.test(location.pathname)){
    // Предпросмотр из конструктора: персонаж лежит в этом браузере, в базу не ходим
    let data = null;
    try { data = JSON.parse(localStorage.getItem("novice-sheet:preview")); } catch (e) {}
    try { localStorage.removeItem("novice-sheet:preview:v2"); } catch (e) {}
    return data ? { id: "preview", data } : null;
  }
  const demo = location.pathname.match(/^\/demo\/([a-z0-9-]+)\/?$/i);
  if (demo) return { id: "demo-" + demo[1], data: await getJSON(`/data/demo-${demo[1]}.json`) };
  const m = location.pathname.match(/^\/c\/([a-z0-9]+)\/?$/i);
  if (!m) return { id: "demo", data: await getJSON("/data/mirta.json") };
  const cfg = window.APP_CONFIG || {};
  const CACHE = `novice-sheet:copy:${m[1]}`;
  try {
    const r = await fetch(`${cfg.supabaseUrl}/rest/v1/rpc/get_shared_character`, {
      method: "POST",
      headers: { "Content-Type": "application/json", apikey: cfg.supabaseKey },
      body: JSON.stringify({ slug: m[1] })
    });
    if (!r.ok) throw new Error("rpc " + r.status);
    const rows = await r.json();
    if (!rows.length){ try { localStorage.removeItem(CACHE); } catch (e) {} return null; }
    // Копия на устройстве: если на игре пропадёт связь, лист всё равно откроется
    try { localStorage.setItem(CACHE, JSON.stringify(rows[0].data)); } catch (e) {}
    return { id: m[1], data: rows[0].data };
  } catch (err){
    let copy = null;
    try { copy = JSON.parse(localStorage.getItem(CACHE)); } catch (e) {}
    if (copy){ offlineNote = true; return { id: m[1], data: copy }; }
    throw err;
  }
}

Promise.all([loadCharacter(), getJSON("/data/knowledge.json")])
  .then(([found, kb]) => {
    if (!found){
      app.innerHTML = `<p class="loading">Персонаж не найден. Проверь ссылку или попроси мастера прислать её ещё раз.</p>`;
      return;
    }
    CH = found.data; KB = kb;
    KEY = `novice-sheet:${found.id}:v2`;
    document.title = `${CH.name} · Чарник новичка`;
    CH.features.forEach(f => { byId[f.id] = f; });
    S = load();
    render();
    let start = (location.hash || "").slice(1);
    if (!TABS.includes(start)){ try { start = localStorage.getItem(TAB_KEY) || "stats"; } catch (e) { start = "stats"; } }
    setTab(start, false);
    refresh();
  })
  .catch(err => {
    console.error(err);
    app.innerHTML = `<p class="loading">Не получилось открыть персонажа. Обнови страницу.</p>`;
  });
})();
</script>
