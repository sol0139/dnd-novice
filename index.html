<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Чарник новичка</title>
<meta name="description" content="Мастер собирает персонажа, игрок открывает его по ссылке: способности разложены по ходу, каждое слово объяснено.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%232EB41B'/%3E%3Cpath d='M16 6l8.5 4.9v10.2L16 26l-8.5-4.9V10.9z M16 6l-5 14h10z' fill='none' stroke='white' stroke-width='1.8' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@500;600&family=Wix+Madefor+Text:wght@600&display=swap">
<link rel="stylesheet" href="/theme.css">
<style>
/* Мастерская: вход и список персонажей мастера. Тот же язык, что у листа персонажа. */
.wrap{max-width:600px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:12px calc(48px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:24px}
.loading{padding-block:38vh 0;text-align:center;color:var(--fg-3);font-size:15px}

.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px}
.brand{display:inline-flex;align-items:center;gap:10px;font-family:var(--f-head);font-weight:500;font-size:16px;letter-spacing:-.3px;color:var(--fg);text-decoration:none}
.brand-mark{width:34px;height:34px;border-radius:11px;background:var(--accent);display:grid;place-items:center;color:#fff;flex:none}
.brand-mark svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round}
.top-btns{display:flex;align-items:center;gap:8px}
.iconbtn{flex:none;width:48px;height:48px;border-radius:50%;border:0;background:var(--glass);color:var(--fg);display:grid;place-items:center}
.me{display:inline-flex;align-items:center;gap:8px;height:48px;padding:0 6px 0 6px;border-radius:24px;background:var(--glass)}
.me img,.me .ph{width:36px;height:36px;border-radius:50%;object-fit:cover;background:var(--neutral)}
.me span{max-width:9em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500;font-size:14.5px;padding-right:4px}

.card{background:var(--surface);border-radius:24px;box-shadow:var(--shadow)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:12px 20px;border:0;border-radius:20px;
  font-family:var(--f-btn);font-weight:600;font-size:15.5px;letter-spacing:-.15px;text-decoration:none;cursor:pointer}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.neutral{background:var(--neutral);color:var(--fg)}
.btn.surface{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.btn.discord{background:#5865F2;color:#fff}
.btn.danger{background:var(--danger);color:#fff}
.btn.sm{min-height:42px;padding:9px 16px;font-size:14.5px;border-radius:16px}
.btn[disabled]{opacity:.6;cursor:progress}
.meta{font-size:14px;line-height:1.45;color:var(--fg-3)}
.eyebrow{font-size:14px;font-weight:500;color:var(--fg-3)}
h1{font-family:var(--f-head);font-weight:600;font-size:34px;line-height:1.08;letter-spacing:-.5px}
h2{font-family:var(--f-head);font-weight:500;font-size:20px;line-height:1.15;letter-spacing:-.5px}
.lead{font-size:16.5px;line-height:1.45;color:var(--fg-2);max-width:40ch}
.alert{padding:14px 16px;border-radius:18px;background:color-mix(in srgb,var(--danger) 11%,var(--surface));font-size:15px;line-height:1.4}

/* Гость */
.hero{display:flex;flex-direction:column;gap:12px;padding-top:12px}
.hero-btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.steps{display:grid;gap:8px;counter-reset:step}
.step{padding:18px 20px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;align-items:baseline}
.step::before{counter-increment:step;content:counter(step);grid-row:1 / span 2;width:32px;height:32px;border-radius:50%;
  background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent-ink);display:grid;place-items:center;
  font-family:var(--f-head);font-weight:600;font-size:15px}
.step b{font-weight:600;font-size:16px}
.step p{font-size:14.5px;line-height:1.4;color:var(--fg-3)}

/* Мастер */
.new{padding:18px 20px 20px;display:flex;flex-direction:column;gap:12px}
.new-row{display:flex;gap:8px}
.new-row input{flex:1;min-width:0;height:52px;padding:0 16px;border:0;border-radius:14px;background:var(--neutral);color:var(--fg);font:inherit;font-size:16px}
.new-row input::placeholder{color:var(--fg-3)}
.chars{display:flex;flex-direction:column;gap:10px}
.char{padding:18px 20px 18px;display:flex;flex-direction:column;gap:12px}
.char-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.char-h h3{font-family:var(--f-head);font-weight:500;font-size:19px;letter-spacing:-.4px;min-width:0;overflow-wrap:anywhere}
.char-h time{flex:none;font-size:12.5px;color:var(--fg-3)}
.char-sub{font-size:14.5px;color:var(--fg-3)}
.char-link{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:13px;color:var(--fg-3);
  padding:8px 12px;border-radius:12px;background:var(--neutral);overflow-x:auto;white-space:nowrap;user-select:all}
.char-acts{display:flex;flex-wrap:wrap;gap:8px}
.char-acts .del{margin-left:auto;background:transparent;color:var(--fg-3)}
.confirm{display:flex;flex-direction:column;gap:10px;padding:14px 16px;border-radius:18px;background:color-mix(in srgb,var(--danger) 9%,var(--surface))}
.empty{padding:28px 20px;text-align:center;color:var(--fg-3);font-size:15px;line-height:1.45}

.foot{font-size:12.5px;line-height:1.45;color:var(--fg-3)}

.toast-wrap{position:fixed;left:0;right:0;z-index:16;display:flex;justify-content:center;pointer-events:none;
  bottom:calc(16px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.toast{pointer-events:auto;width:100%;max-width:568px;padding:14px 18px;border-radius:20px;background:var(--toast-bg);color:var(--toast-fg);
  box-shadow:var(--shadow-float);font-size:15px;line-height:1.35;overflow-wrap:anywhere}
</style>
<script>
  /* Тема выставляется до отрисовки, чтобы страница не мигала */
  try { var t = localStorage.getItem("novice-sheet:theme"); if (t) document.documentElement.setAttribute("data-theme", t); } catch (e) {}
</script>
<script src="/config.js"></script>
</head>
<body>
<div class="wrap" id="app">
  <p class="loading">Открываем мастерскую…</p>
</div>

<div class="toast-wrap" id="toastWrap" hidden>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>

<script type="module" src="/workshop.js"></script>
</body>
</html>
