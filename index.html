<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Чарник новичка</title>
<meta name="description" content="Мастер собирает персонажа, игрок открывает его по ссылке: способности разложены по ходу, каждое слово объяснено.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%232EB41B'/%3E%3Cpath d='M16 6l8.5 4.9v10.2L16 26l-8.5-4.9V10.9z M16 6l-5 14h10z' fill='none' stroke='white' stroke-width='1.8' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@500;600&family=Wix+Madefor+Text:wght@600&display=swap">
<link rel="stylesheet" href="/theme.css">
<style>
/* Мастерская: вход и список персонажей мастера. Тот же язык, что у листа персонажа. */
.wrap{max-width:600px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:12px calc(48px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:24px}
.loading{padding-block:38vh 0;text-align:center;color:var(--fg-3);font-size:15px}

.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px}
.brand{display:inline-flex;align-items:center;gap:10px;font-family:var(--f-head);font-weight:500;font-size:16px;letter-spacing:-.3px;color:var(--fg);text-decoration:none}
.brand-mark{width:34px;height:34px;border-radius:11px;background:var(--accent);display:grid;place-items:center;color:#fff;flex:none}
.brand-mark svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round}
.top-btns{display:flex;align-items:center;gap:8px}
.iconbtn{flex:none;width:48px;height:48px;border-radius:50%;border:0;background:var(--glass);color:var(--fg);display:grid;place-items:center}
.me{display:inline-flex;align-items:center;gap:8px;height:48px;padding:0 6px 0 6px;border-radius:24px;background:var(--glass)}
.me img,.me .ph{width:36px;height:36px;border-radius:50%;object-fit:cover;background:var(--neutral)}
.me span{max-width:9em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500;font-size:14.5px;padding-right:4px}

.card{background:var(--surface);border-radius:24px;box-shadow:var(--shadow)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:12px 20px;border:0;border-radius:20px;
  font-family:var(--f-btn);font-weight:600;font-size:15.5px;letter-spacing:-.15px;text-decoration:none;cursor:pointer}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.neutral{background:var(--neutral);color:var(--fg)}
.btn.surface{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.btn.discord{background:#5865F2;color:#fff}
.btn.danger{background:var(--danger);color:#fff}
.btn.sm{min-height:42px;padding:9px 16px;font-size:14.5px;border-radius:16px}
.btn[disabled]{opacity:.6;cursor:progress}
.meta{font-size:14px;line-height:1.45;color:var(--fg-3)}
.eyebrow{font-size:14px;font-weight:500;color:var(--fg-3)}
h1{font-family:var(--f-head);font-weight:600;font-size:34px;line-height:1.08;letter-spacing:-.5px}
h2{font-family:var(--f-head);font-weight:500;font-size:20px;line-height:1.15;letter-spacing:-.5px}
.lead{font-size:16.5px;line-height:1.45;color:var(--fg-2);max-width:40ch}
.alert{padding:14px 16px;border-radius:18px;background:color-mix(in srgb,var(--danger) 11%,var(--surface));font-size:15px;line-height:1.4}

/* Гость */
.hero{display:flex;flex-direction:column;gap:12px;padding-top:12px}
.hero-btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.steps{display:grid;gap:8px;counter-reset:step}
.step{padding:18px 20px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;align-items:baseline}
.step::before{counter-increment:step;content:counter(step);grid-row:1 / span 2;width:32px;height:32px;border-radius:50%;
  background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent-ink);display:grid;place-items:center;
  font-family:var(--f-head);font-weight:600;font-size:15px}
.step b{font-weight:600;font-size:16px}
.step p{font-size:14.5px;line-height:1.4;color:var(--fg-3)}

/* Мастер */
.new{padding:18px 20px 20px;display:flex;flex-direction:column;gap:12px}
.new-row{display:flex;gap:8px}
.new-row input{flex:1;min-width:0;height:52px;padding:0 16px;border:0;border-radius:14px;background:var(--neutral);color:var(--fg);font:inherit;font-size:16px}
.new-row input::placeholder{color:var(--fg-3)}
.chars{display:flex;flex-direction:column;gap:10px}
.char{padding:18px 20px 18px;display:flex;flex-direction:column;gap:12px}
.char-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.char-h h3{font-family:var(--f-head);font-weight:500;font-size:19px;letter-spacing:-.4px;min-width:0;overflow-wrap:anywhere}
.char-h time{flex:none;font-size:12.5px;color:var(--fg-3)}
.char-sub{font-size:14.5px;color:var(--fg-3)}
.char-link{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:13px;color:var(--fg-3);
  padding:8px 12px;border-radius:12px;background:var(--neutral);overflow-x:auto;white-space:nowrap;user-select:all}
.char-acts{display:flex;flex-wrap:wrap;gap:8px}
.char-acts .del{margin-left:auto;background:transparent;color:var(--fg-3)}
.confirm{display:flex;flex-direction:column;gap:10px;padding:14px 16px;border-radius:18px;background:color-mix(in srgb,var(--danger) 9%,var(--surface))}
.empty{padding:28px 20px;text-align:center;color:var(--fg-3);font-size:15px;line-height:1.45}

.foot{font-size:12.5px;line-height:1.45;color:var(--fg-3)}

/* Импорт из LSS */
.filebtn{align-self:flex-start;position:relative}
.filebtn input{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;flex-direction:column;gap:4px;margin-bottom:2px}
.sec-h p{font-size:14px;line-height:1.45;color:var(--fg-3)}
.tally{display:flex;flex-wrap:wrap;gap:8px}
.tl{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:18px;background:var(--surface);box-shadow:var(--shadow);font-size:14px;font-weight:500}
.tl::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.tl.ok{color:var(--accent-ink)}.tl.warn{color:var(--warn,#C27A00)}.tl.error{color:var(--danger)}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld span{font-size:13px;color:var(--fg-3)}
.fld input,.rvf-ta,.uses-fld input{height:48px;padding:0 14px;border:0;border-radius:14px;background:var(--neutral);color:var(--fg);font:inherit;font-size:16px;min-width:0;width:100%}
.rvf-ta{height:auto;padding:12px 14px;resize:vertical;line-height:1.4}
.rv-who{padding:18px 20px 20px;display:flex;flex-direction:column;gap:14px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{min-height:38px;padding:6px 14px;border:0;border-radius:14px;background:var(--neutral);color:var(--fg-2);font-family:var(--f-btn);font-weight:600;font-size:13.5px;cursor:pointer}
.seg-l{display:inline-flex;align-items:center;min-width:64px;font-size:12.5px;color:var(--fg-3)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.fds{padding:6px 0}
.fd{display:grid;grid-template-columns:20px minmax(0,1fr);gap:10px;padding:12px 18px}
.fd + .fd{border-top:1px solid var(--line,color-mix(in srgb,var(--fg) 8%,transparent))}
.fd-dot{width:10px;height:10px;border-radius:50%;margin-top:6px;background:var(--fg-3)}
.fd.error .fd-dot{background:var(--danger)}.fd.warn .fd-dot{background:var(--warn,#C27A00)}.fd.info .fd-dot{background:var(--k-passive,#8A8F98)}
.fd-body{display:flex;flex-direction:column;gap:10px;font-size:15px;line-height:1.45}
.fd-acts{display:flex;flex-wrap:wrap;gap:6px}
.rv-ok{padding:14px 20px}
.rv-ok summary{cursor:pointer;font-weight:500}
.rv-ok ul{margin:10px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px;line-height:1.4;color:var(--fg-2)}
.rvf{padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px}
.rvf.dropped{opacity:.55}
.rvf-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rvf-title{flex:1 1 180px;min-width:0;height:42px;padding:0 12px;border:0;border-radius:12px;background:var(--neutral);color:var(--fg);font:inherit;font-weight:600;font-size:16px}
.pill{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:12px;background:color-mix(in srgb,var(--warn,#C27A00) 16%,transparent);color:var(--warn,#C27A00);font-size:12.5px;font-weight:600}
.src{font-size:12.5px;color:var(--fg-3)}
.rvf-d{font-size:14.5px;line-height:1.45;color:var(--fg-2)}
.rvf-more summary{cursor:pointer;font-size:13.5px;color:var(--fg-3)}
.rvf-more p{margin-top:6px;font-size:14px;line-height:1.45;color:var(--fg-2);white-space:pre-line}
.uses-fld{display:flex;align-items:center;flex-wrap:wrap;gap:8px;font-size:14px;color:var(--fg-2)}
.uses-fld input{width:72px;height:40px;text-align:center}
.wrow{display:grid;grid-template-columns:90px minmax(0,1fr) minmax(0,1fr);gap:8px}
@media (max-width:420px){.wrow{grid-template-columns:1fr 1fr}.wrow .fld:last-child{grid-column:1 / -1}}
.eqs{display:flex;flex-direction:column;gap:6px}
.eq{display:flex;align-items:center;gap:10px;padding:10px 8px 10px 16px;border-radius:16px}
.eq > span{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;font-size:15px}
.eq small{font-size:13px;color:var(--fg-3);line-height:1.35}
.eq button{flex:none;width:40px;height:40px;border:0;border-radius:50%;background:var(--neutral);color:var(--fg-2);font-size:20px;line-height:1;cursor:pointer}
.savebar{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:5;display:grid;grid-template-columns:auto 1fr;gap:8px;
  padding:8px;border-radius:26px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.savebar .btn[disabled]{cursor:not-allowed}

/* Новый персонаж: четыре дороги */
.ways{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.way{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-width:0;padding:14px 14px 16px;border:0;border-radius:20px;
  background:var(--neutral);color:var(--fg);text-align:left;font:inherit;cursor:pointer;transition:background-color .15s}
.way:hover{background:color-mix(in srgb,var(--accent) 12%,var(--neutral))}
.way:active{transform:scale(.98)}
.way svg.i{width:26px;height:26px;margin-bottom:6px;color:var(--accent-ink)}
.way b{font-weight:600;font-size:15.5px;line-height:1.25}
.way span{font-size:13px;line-height:1.35;color:var(--fg-3)}
.way input{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}
.linkbtn{background:none;border:0;padding:0;font:inherit;color:var(--accent-ink);cursor:pointer}

/* Конструктор: плашки выбора */
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pick.sub{padding-top:2px}
.pk{display:inline-flex;align-items:baseline;gap:6px;min-height:40px;padding:8px 14px;border:0;border-radius:14px;background:var(--surface);box-shadow:var(--shadow);
  color:var(--fg);font-family:var(--f-btn);font-weight:600;font-size:14px;letter-spacing:-.1px;cursor:pointer}
.pk small{font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--fg-3)}
.pk[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);box-shadow:none}
.pk[aria-pressed="true"] small{color:color-mix(in srgb,var(--on-accent) 75%,transparent)}
.pk:active{transform:scale(.97)}
.pk.locked{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line);color:var(--fg-3);cursor:default}
.pick-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:6px}
.pick-h b{font-weight:600;font-size:15px}
.pick-l{font-size:13px;color:var(--fg-3);margin:2px 0 -4px}
.cnt{flex:none;padding:3px 10px;border-radius:999px;background:var(--neutral);font-size:12.5px;font-weight:500;color:var(--fg-3)}
.cnt.full{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent-ink)}
.cr-box{padding:18px 20px 20px;display:flex;flex-direction:column;gap:14px}
.fld-row{display:flex;gap:8px}
.fld-row input{flex:1}
.abls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.abl{display:grid;grid-template-columns:auto 1fr;grid-template-areas:"n m" "i i" "b b";align-items:center;gap:6px 8px;padding:12px;min-width:0}
.abl-n{grid-area:n;font-size:12.5px;font-weight:600;letter-spacing:.04em;color:var(--fg-3)}
.abl-m{grid-area:m;justify-self:end;font-family:var(--f-head);font-weight:600;font-size:17px}
.abl input{grid-area:i;width:100%;min-width:0;height:44px;padding:0 10px;border:0;border-radius:12px;background:var(--neutral);color:var(--fg);
  font-family:var(--f-head);font-weight:600;font-size:18px;text-align:center}
.abl-b{grid-area:b;font-size:12.5px;color:var(--fg-3);text-align:center}
.sels{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.mini-sel{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--fg-2)}
.mini-sel select{height:40px;padding:0 10px;border:0;border-radius:12px;background:var(--surface);box-shadow:var(--shadow);color:var(--fg);font:inherit;font-size:14px}
.cr-sum{padding:18px 20px 20px;display:flex;flex-direction:column;gap:12px}
.sum-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sum-h h3{font-family:var(--f-head);font-weight:500;font-size:19px;letter-spacing:-.4px}
.sum-tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
@media (max-width:420px){ .sum-tiles{grid-template-columns:repeat(2,minmax(0,1fr))} }
.sum-tiles span{display:flex;flex-direction:column;gap:2px;padding:10px;border-radius:14px;background:var(--neutral);min-width:0}
.sum-tiles small{font-size:11.5px;color:var(--fg-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sum-tiles b{font-family:var(--f-head);font-weight:600;font-size:20px}
.sum-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.sum-list li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line);font-size:14.5px}
.sum-list b{font-family:var(--f-head);font-weight:600;font-size:14.5px;white-space:nowrap}
.cr-sum .btn{align-self:flex-start}

/* Список персонажей: действия на весь стол, поиск, второстепенные кнопки */
.list-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.list-h h2{display:flex;align-items:center;gap:8px}
.list-acts{display:flex;flex-wrap:wrap;gap:8px}
.search{width:100%;height:48px;padding:0 16px;border:0;border-radius:16px;background:var(--surface);box-shadow:var(--shadow);color:var(--fg);font:inherit;font-size:16px}
.char-more{display:flex;flex-wrap:wrap;gap:6px 18px;padding:0 2px}
.char-more .linkbtn{font-size:14px;font-weight:500}
.linkbtn.muted{color:var(--fg-3)}
.linkbtn[disabled]{opacity:.5}
/* QR-код */
.qr-dlg{margin:auto;width:min(360px,calc(100% - 32px));padding:0;border:0;border-radius:28px;background:var(--surface);color:var(--fg);box-shadow:var(--shadow-float)}
.qr-dlg::backdrop{background:var(--scrim)}
.qr-in{padding:22px;display:flex;flex-direction:column;gap:14px}
.qr-in h3{font-family:var(--f-head);font-weight:500;font-size:20px;letter-spacing:-.4px}
.qr-box{padding:14px;border-radius:20px;background:#fff}
.qr-box svg{display:block;width:100%;height:auto}
/* Шпаргалка стола */
.tbl{display:flex;flex-direction:column;gap:10px}
.tbl-card{padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.tbl-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.tbl-h h3{font-family:var(--f-head);font-weight:500;font-size:18px;letter-spacing:-.3px}
.tbl-tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px}
.tbl-tiles span{display:flex;flex-direction:column;gap:2px;padding:9px 10px;border-radius:14px;background:var(--neutral);min-width:0}
.tbl-tiles small{font-size:11.5px;line-height:1.2;color:var(--fg-3)}
.tbl-tiles b{font-family:var(--f-head);font-weight:600;font-size:19px}
.tbl-sum{padding:16px 18px;display:flex;flex-direction:column;gap:8px;font-size:15px;line-height:1.45}
/* Конструктор: что делают выбранные заклинания */
.sel-info{border-radius:18px;background:var(--surface);box-shadow:var(--shadow)}
.sel-info summary{padding:14px 16px;font-weight:600;font-size:15px;cursor:pointer}
.sel-info ul{list-style:none;margin:0;padding:0 16px 14px;display:flex;flex-direction:column;gap:10px}
.sel-info li{display:flex;flex-direction:column;gap:2px;font-size:14px;line-height:1.4;color:var(--fg-2)}
.sel-info li b{font-weight:600;color:var(--fg)}
.sel-info li small{font-size:12px;color:var(--fg-3)}
@media print{ .top-row,.hero .eyebrow,.pick,.foot{display:none} .tbl-card,.tbl-sum{box-shadow:none;border:1px solid #ccc} }

/* Шаблоны */
.tpls{display:flex;flex-direction:column;gap:10px}
.tpl{padding:18px 20px;display:flex;flex-direction:column;gap:10px}
.tpl-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.tpl-h h3{font-family:var(--f-head);font-weight:500;font-size:19px;letter-spacing:-.4px}
.tpl-pitch{font-size:15px;line-height:1.4;color:var(--fg-2)}
.tpl-stats{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13.5px;color:var(--fg-3)}
.tpl-stats b{font-family:var(--f-head);font-weight:600;color:var(--fg)}

.toast-wrap{position:fixed;left:0;right:0;z-index:16;display:flex;justify-content:center;pointer-events:none;
  bottom:calc(16px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.toast{pointer-events:auto;width:100%;max-width:568px;padding:14px 18px;border-radius:20px;background:var(--toast-bg);color:var(--toast-fg);
  box-shadow:var(--shadow-float);font-size:15px;line-height:1.35;overflow-wrap:anywhere}
</style>
<script>
  /* Тема выставляется до отрисовки, чтобы страница не мигала */
  try { var t = localStorage.getItem("novice-sheet:theme"); if (t) document.documentElement.setAttribute("data-theme", t); } catch (e) {}
</script>
<script src="/config.js"></script>
</head>
<body>
<div class="wrap" id="app">
  <p class="loading">Открываем мастерскую…</p>
</div>

<div class="toast-wrap" id="toastWrap" hidden>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>

<script type="module" src="/workshop.js"></script>
</body>
</html>
